
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Birthday Template Flow | RHK WISHES</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f6f1eb;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    height: 100dvh;
}

.stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
}

.stage img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: fill;
}

/* Invisible clickable button areas */

.hotspot {
    position: absolute;
    bottom: 0;
    height: 12%;
    z-index: 5;
    display: block;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

/* VIEW DEMO TEMPLATE */

.demo-button {
    left: 1%;
    width: 49%;
}

/* USE THIS TEMPLATE */

.use-button {
    right: 1%;
    width: 49%;
}

/* Tap effect */

.hotspot:active {
    background: rgba(255,255,255,0.15);
}
</style>
</head>

<body>

<div class="stage">

    <!-- TEMPLATE FLOW IMAGE -->

    <img
        src="screen1.jpg"
        alt="Birthday Template Flow"
    >

    <!-- VIEW DEMO BUTTON -->

    <a
        href="demo1.html"
        class="hotspot demo-button"
        aria-label="View Demo Template">
    </a>

    <!-- USE TEMPLATE BUTTON -->

    <a
        href="sender1.html"
        class="hotspot use-button"
        aria-label="Use This Template">
    </a>

</div>

</body>
</html>
