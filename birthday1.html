
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Template Flow | RHK WISHES</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #f6f1eb;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100svh;
    overflow-x: hidden;
    font-family: Arial, sans-serif;
}

.stage {
    position: relative;
    width: min(100vw, calc(100svh * 1.06925));
    aspect-ratio: 1297 / 1213;
    flex-shrink: 0;
}

.stage img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* Invisible interactive buttons */
.hotspot {
    position: absolute;
    bottom: 3.5%;
    height: 9%;
    display: block;
    z-index: 5;
    cursor: pointer;
    border-radius: 12px;
    -webkit-tap-highlight-color: transparent;
}

/* View demo button */
.demo-button {
    left: 1.5%;
    width: 48%;
}

/* Use template button */
.use-button {
    right: 1.5%;
    width: 48%;
}

/* Tap feedback */
.hotspot:active {
    background: rgba(255, 255, 255, 0.12);
}

@media (max-height: 450px) {
    body {
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<div class="stage">

    <!-- Main template flow image -->
    <img
        src="screen1.jpg"
        alt="Birthday scrapbook template flow"
    >

    <!-- VIEW DEMO TEMPLATE -->
    <a
        href="demo1.html"
        class="hotspot demo-button"
        aria-label="View demo template"
    ></a>

    <!-- USE THIS TEMPLATE -->
    <a
        href="sender1.html"
        class="hotspot use-button"
        aria-label="Use this birthday template"
    ></a>

</div>

</body>
</html>
