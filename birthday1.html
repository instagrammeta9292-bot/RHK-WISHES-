
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>RHK WISHES - Birthday Template</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff5e9;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    height: 100dvh;
}

.stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.background-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    object-fit: fill;
}

/* BUTTON CLICK AREAS */

.hotspot {
    position: absolute;
    top: 80.5%;
    height: 11.5%;
    z-index: 10;
    display: block;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

/* VIEW DEMO */

.demo-button {
    left: 2.5%;
    width: 46.5%;
}

/* USE TEMPLATE */

.use-button {
    right: 2.5%;
    width: 46.5%;
}

/* TAP EFFECT */

.hotspot:active {
    background: rgba(255,255,255,0.12);
    border-radius: 20px;
}

</style>
</head>

<body>

<div class="stage">

    <!-- MOBILE TEMPLATE IMAGE -->

    <img
        src="screen1.jpg"
        class="background-image"
        alt="Birthday template flow"
    >

    <!-- VIEW DEMO TEMPLATE -->

    <a
        href="demo1.html"
        class="hotspot demo-button"
        aria-label="View demo template">
    </a>

    <!-- USE THIS TEMPLATE -->

    <a
        href="sender1.html"
        class="hotspot use-button"
        aria-label="Use this template">
    </a>

</div>

</body>
</html>
