<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Photo Book</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #f1e7e2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 12px;
    font-family: Arial, sans-serif;
}

.app {
    width: 100%;
    max-width: 520px;
    text-align: center;
}

/* BOOK */

.book-stage {
    width: 100%;
    aspect-ratio: 1267 / 1260;
    perspective: 1800px;
    position: relative;
}

.inside-page {
    position: absolute;
    inset: 0;
    background: #fff9f6;
    border-radius: 5px;
    box-shadow: 0 10px 35px #0003;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.inside-content {
    text-align: center;
    line-height: 2;
}

.inside-content h2 {
    color: #d65396;
    font-family: Georgia, serif;
    font-size: 28px;
}

.inside-content p {
    color: #79536a;
    font-size: 15px;
}

/* FRONT COVER */

.cover {
    position: absolute;
    inset: 0;
    z-index: 2;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 1.8s cubic-bezier(.65, 0, .25, 1);
}

.cover.open {
    transform: rotateY(-155deg);
}

.cover-image {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    display: block;
    object-fit: fill;
    backface-visibility: hidden;
}

/* PHOTO FRAME */

.photo-slot {
    position: absolute;

    /* Position on your original cover */
    left: 29.8%;
    top: 25.8%;
    width: 52.8%;
    height: 45.5%;

    background: #f7d8e8;
    overflow: hidden;

    clip-path: polygon(
        0% 5%,
        100% 0%,
        100% 94%,
        12% 100%
    );
}

.girl-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
}

/* PLUS BUTTON */

.photo-action {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #bd4c88;
}

.empty-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.plus {
    width: 65px;
    height: 65px;
    border: 2px dashed #bd4c88;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 43px;
    background: #ffffffaa;
}

.add-text {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
}

/* WHEN PHOTO IS AVAILABLE */

.photo-slot.has-photo .photo-action {
    inset: auto 8px 8px auto;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #ffffffed;
    box-shadow: 0 2px 8px #0005;
}

.photo-slot.has-photo .empty-content {
    display: block;
}

.photo-slot.has-photo .plus {
    width: auto;
    height: auto;
    border: none;
    background: transparent;
    font-size: 26px;
    color: #d64d91;
}

.photo-slot.has-photo .add-text {
    display: none;
}

.photo-action:disabled {
    cursor: wait;
    opacity: .6;
}

#photoInput {
    display: none;
}

/* OPEN BOOK BUTTON */

.open-btn {
    margin-top: 24px;
    padding: 16px 42px;
    border: none;
    border-radius: 5px;
    background: #111;
    color: white;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 5px 15px #0003;
    transition: .2s;
}

.open-btn:active {
    transform: scale(.96);
}

.open-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.status {
    min-height: 20px;
    margin-top: 14px;
    color: #76586a;
    font-size: 12px;
}

@media(max-width:380px) {
    .open-btn {
        padding: 14px 32px;
    }

    .plus {
        width: 48px;
        height: 48px;
        font-size: 32px;
    }

    .add-text {
        font-size: 9px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="book-stage">

        <!-- INSIDE PAGE -->

        <div class="inside-page">
            <div class="inside-content">
                <h2>Happy Birthday ❤️</h2>
                <p>A special book for a special person.</p>
                <p>May your life always shine ✨</p>
            </div>
        </div>

        <!-- FRONT COVER -->

        <div class="cover" id="cover">

            <img
                src="201816.jpg"
                class="cover-image"
                alt="Birthday book cover"
            >

            <!-- PHOTO FRAME -->

            <div class="photo-slot" id="photoSlot">

                <img
                    src=""
                    class="girl-photo"
                    id="girlPhoto"
                    alt="Birthday photo"
                >

                <!-- ONLY PLUS ICON -->

                <button
                    type="button"
                    class="photo-action"
                    id="photoAction"
                    aria-label="Add or change photo"
                >
                    <span class="empty-content">
                        <span class="plus">+</span>
                        <span class="add-text">ADD YOUR PHOTO</span>
                    </span>
                </button>

            </div>

        </div>

    </div>

    <!-- PHOTO INPUT -->

    <input
        type="file"
        id="photoInput"
        accept="image/jpeg,image/png,image/webp"
    >

    <!-- OPEN BOOK -->

    <button class="open-btn" id="openBtn">
        OPEN BOOK
    </button>

    <div class="status" id="status">
        Connecting...
    </div>

</div>

<script>

// ==========================================
// 1. FIREBASE CONFIGURATION
// ==========================================

const firebaseConfig = {
    apiKey: "AIzaSyBND3n2ag9qGZG5SJPOKNVYr2dHNLwoD7Y",
    authDomain: "rhk-music-24bbc.firebaseapp.com",
    databaseURL: "https://rhk-music-24bbc-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "rhk-music-24bbc",
    storageBucket: "rhk-music-24bbc.firebasestorage.app",
    messagingSenderId: "571438674805",
    appId: "1:571438674805:web:bcfe7856316b638d08193c",
    measurementId: "G-RF4GEDGP9N"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();


// ==========================================
// 2. CLOUDINARY CONFIGURATION
// ==========================================

const CLOUDINARY_NAME = "nhy9lfkt";
const UPLOAD_PRESET = "rhk_upload";


// ==========================================
// 3. APP DATABASE PATH
// ==========================================

// Change this ID for each new application.
// sender1, sender2, sender3 etc.

const APP_ID = "sender1";

const photoRef = db.ref(
    "apps/" + APP_ID + "/coverPhoto"
);


// ==========================================
// 4. HTML ELEMENTS
// ==========================================

const photoInput = document.getElementById("photoInput");
const photoSlot = document.getElementById("photoSlot");
const photoAction = document.getElementById("photoAction");
const girlPhoto = document.getElementById("girlPhoto");
const cover = document.getElementById("cover");
const openBtn = document.getElementById("openBtn");
const statusText = document.getElementById("status");


// ==========================================
// 5. APP VARIABLES
// ==========================================

let authReady = false;
let uploading = false;
let savedPhotoURL = null;


// ==========================================
// 6. DISPLAY PHOTO
// ==========================================

function showPhoto(url) {

    if (!url) {

        girlPhoto.removeAttribute("src");
        girlPhoto.style.display = "none";

        photoSlot.classList.remove("has-photo");

        return;
    }

    girlPhoto.onload = function() {

        girlPhoto.style.display = "block";

        photoSlot.classList.add("has-photo");

    };

    girlPhoto.onerror = function() {

        girlPhoto.style.display = "none";

        photoSlot.classList.remove("has-photo");

        statusText.textContent = "Photo could not be loaded.";

    };

    girlPhoto.src = url;
}


// ==========================================
// 7. FIREBASE AUTHENTICATION
// ==========================================

auth.signInAnonymously()

.then(() => {

    authReady = true;

    statusText.textContent = "Connected successfully ❤️";

    // REAL-TIME DATABASE LISTENER

    photoRef.on("value", snapshot => {

        // Do not overwrite the local preview during upload
        if (uploading) return;

        const data = snapshot.val();

        if (data && data.url) {

            savedPhotoURL = data.url;

            showPhoto(savedPhotoURL);

        } else {

            savedPhotoURL = null;

            showPhoto(null);

        }

    }, error => {

        statusText.textContent =
            "Database error: " + error.message;

    });

})

.catch(error => {

    console.error(error);

    statusText.textContent =
        "Firebase error: " + error.message;

});


// ==========================================
// 8. OPEN PHOTO SELECTOR
// ==========================================

photoAction.addEventListener("click", function() {

    if (uploading) return;

    photoInput.click();

});


// ==========================================
// 9. CLOUDINARY PHOTO UPLOAD
// ==========================================

photoInput.addEventListener("change", async function() {

    const file = this.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {

        alert("Please select an image.");

        photoInput.value = "";

        return;
    }

    if (file.size > 10 * 1024 * 1024) {

        alert("Maximum image size is 10 MB.");

        photoInput.value = "";

        return;
    }

    if (!authReady) {

        alert("Firebase is not connected yet.");

        photoInput.value = "";

        return;
    }

    if (uploading) return;

    uploading = true;

    photoAction.disabled = true;

    statusText.textContent = "Uploading photo...";

    // Preserve the previously saved photo

    const previousPhotoURL = savedPhotoURL;

    // Temporary local preview

    const localURL = URL.createObjectURL(file);

    showPhoto(localURL);

    try {

        // Prepare Cloudinary upload

        const formData = new FormData();

        formData.append("file", file);

        formData.append("upload_preset", UPLOAD_PRESET);


        // Upload image

        const response = await fetch(
            "https://api.cloudinary.com/v1_1/" +
            CLOUDINARY_NAME +
            "/image/upload",
            {
                method: "POST",
                body: formData
            }
        );

        const result = await response.json();

        if (!response.ok) {

            throw new Error(
                result.error?.message || "Cloudinary upload failed"
            );

        }

        const imageURL = result.secure_url;


        // Save photo URL in Firebase

        await photoRef.set({

            url: imageURL,

            updatedAt:
                firebase.database.ServerValue.TIMESTAMP

        });


        // Update saved photo

        savedPhotoURL = imageURL;

        showPhoto(imageURL);

        statusText.textContent =
            "Photo saved successfully ❤️";


    } catch(error) {

        console.error(error);

        // Restore previously saved image

        showPhoto(previousPhotoURL);

        statusText.textContent =
            "Upload failed: " + error.message;

        alert("Upload failed: " + error.message);


    } finally {

        uploading = false;

        photoAction.disabled = false;

        URL.revokeObjectURL(localURL);

        photoInput.value = "";

    }

});


// ==========================================
// 10. OPEN / CLOSE BOOK ANIMATION
// ==========================================

openBtn.addEventListener("click", function() {

    if (uploading) {

        alert("Please wait until uploading finishes.");

        return;
    }

    const isOpen = cover.classList.toggle("open");

    if (isOpen) {

        openBtn.textContent = "CLOSE BOOK";

    } else {

        openBtn.textContent = "OPEN BOOK";

    }

});

</script>

</body>
</html>
