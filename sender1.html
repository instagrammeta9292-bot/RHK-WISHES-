
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Photo Book</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: #f2e8e3;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 22px 12px;
  overflow-x: hidden;
}

.app {
  width: 100%;
  max-width: 520px;
  text-align: center;
}

.book-stage {
  width: 100%;
  aspect-ratio: 1267 / 1260;
  perspective: 1500px;
  position: relative;
}

.book-inner {
  position: absolute;
  inset: 0;
  background: #fff7f5;
  border-radius: 5px;
  box-shadow: 0 12px 35px #0003;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 35px;
  color: #d64e91;
  font-size: 25px;
  font-weight: bold;
}

.cover {
  position: absolute;
  inset: 0;
  transform-origin: left center;
  transition: transform 1.7s ease-in-out;
  z-index: 2;
  backface-visibility: hidden;
}

.cover > img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* Girl's photo area on the book cover */

.photo-slot {
  position: absolute;
  left: 29.8%;
  top: 25.8%;
  width: 52.8%;
  height: 45.5%;

  clip-path: polygon(
    0% 5%,
    100% 0%,
    100% 94%,
    12% 100%
  );

  background: #f9d9e9;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.photo-slot img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

.placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: #bd4b83;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  width: 100%;
  height: 100%;
}

.plus {
  font-size: 42px;
  width: 65px;
  height: 65px;
  border: 2px dashed #c84f8c;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

#photoInput {
  display: none;
}

.upload-hint {
  margin-top: 12px;
  font-size: 13px;
  color: #795d6b;
}

.open-btn {
  margin-top: 23px;
  background: #111;
  color: white;
  border: none;
  padding: 16px 42px;
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 2px;
  border-radius: 6px;
  cursor: pointer;
  box-shadow: 0 6px 15px #0003;
  transition: .2s;
}

.open-btn:active {
  transform: scale(.96);
}

.cover.open {
  transform: rotateY(-155deg);
}

.status {
  font-size: 12px;
  color: #765c69;
  margin-top: 15px;
  min-height: 18px;
}

.inner-message {
  text-align: center;
  line-height: 1.8;
}

.inner-message h2 {
  color: #d64e91;
  margin-bottom: 15px;
}

.inner-message p {
  color: #70505e;
  font-size: 15px;
}

@media(max-width:380px) {
  .open-btn {
    padding: 14px 30px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="book-stage">

    <div class="book-inner">
      <div class="inner-message">
        <h2>Happy Birthday ❤️</h2>
        <p>A special book for a special person.</p>
        <p>Your beautiful memories start here ✨</p>
      </div>
    </div>

    <div class="cover" id="cover">

      <!-- Your original book cover -->
      <img src="201816.jpg" alt="Birthday Book Cover">

      <!-- Editable girl's photo area -->
      <div class="photo-slot" id="photoSlot">

        <img id="girlPhoto" alt="Birthday photo">

        <label class="placeholder" id="placeholder"
               for="photoInput">
          <span class="plus">+</span>
          <span>ADD YOUR PHOTO</span>
        </label>

      </div>
    </div>

  </div>

  <input
    type="file"
    id="photoInput"
    accept="image/*"
  >

  <p class="upload-hint">
    Tap the + to add or change the girl's photo
  </p>

  <button class="open-btn" id="openBtn">
    OPEN BOOK
  </button>

  <div class="status" id="status">
    Connecting...
  </div>

</div>

<script>

// =====================================
// 1. FIREBASE CONFIGURATION
// =====================================

const firebaseConfig = {
  apiKey: "AIzaSyBND3n2ag9qGZG5SJPOKNVYr2dHNLwoD7Y",
  authDomain: "rhk-music-24bbc.firebaseapp.com",
  databaseURL: "https://rhk-music-24bbc-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "rhk-music-24bbc",
  storageBucket: "rhk-music-24bbc.firebasestorage.app",
  messagingSenderId: "571438674805",
  appId: "1:571438674805:web:bcfe7856316b638d08193c",
  measurementId: "G-RF4GEDGP9N"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const photoRef = db.ref("birthdayBooks/default/coverPhoto");

// =====================================
// 2. CLOUDINARY CONFIGURATION
// =====================================

// Enter your Cloudinary details here.

const CLOUDINARY_NAME = "YOUR_CLOUDINARY_CLOUD_NAME";
const UPLOAD_PRESET = "YOUR_UNSIGNED_UPLOAD_PRESET";

// =====================================
// 3. HTML ELEMENTS
// =====================================

const photoInput = document.getElementById("photoInput");
const girlPhoto = document.getElementById("girlPhoto");
const placeholder = document.getElementById("placeholder");
const statusText = document.getElementById("status");
const cover = document.getElementById("cover");
const openBtn = document.getElementById("openBtn");

let authReady = false;
let uploading = false;

// =====================================
// 4. PHOTO DISPLAY
// =====================================

function showPhoto(url) {
  if (!url) {
    girlPhoto.style.display = "none";
    placeholder.style.display = "flex";
    girlPhoto.removeAttribute("src");
    return;
  }

  girlPhoto.onload = () => {
    girlPhoto.style.display = "block";
    placeholder.style.display = "none";
  };

  girlPhoto.onerror = () => {
    girlPhoto.style.display = "none";
    placeholder.style.display = "flex";
  };

  girlPhoto.src = url;
}

// =====================================
// 5. FIREBASE AUTHENTICATION
// =====================================

auth.signInAnonymously()
  .then(() => {
    authReady = true;
    statusText.textContent = "Connected successfully";

    // Listen for real-time photo changes
    photoRef.on("value", snapshot => {
      const data = snapshot.val();

      if (data && data.url) {
        showPhoto(data.url);
      } else {
        showPhoto(null);
      }
    });

  })
  .catch(error => {
    console.error(error);
    statusText.textContent =
      "Firebase error: " + error.message;
  });

// =====================================
// 6. SELECT PHOTO
// =====================================

photoInput.addEventListener("change", async function() {

  const file = this.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Please select an image.");
    return;
  }

  if (file.size > 10 * 1024 * 1024) {
    alert("Maximum image size is 10 MB.");
    return;
  }

  if (!authReady) {
    alert("Please wait for Firebase connection.");
    return;
  }

  if (
    CLOUDINARY_NAME === "YOUR_CLOUDINARY_CLOUD_NAME" ||
    UPLOAD_PRESET === "YOUR_UNSIGNED_UPLOAD_PRESET"
  ) {
    alert("Please configure your Cloudinary name and upload preset.");
    return;
  }

  uploading = true;
  statusText.textContent = "Uploading photo...";

  // Show selected photo immediately
  const localPreview = URL.createObjectURL(file);
  showPhoto(localPreview);

  try {

    // Upload to Cloudinary
    const formData = new FormData();

    formData.append("file", file);
    formData.append("upload_preset", UPLOAD_PRESET);

    const response = await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUDINARY_NAME}/image/upload`,
      {
        method: "POST",
        body: formData
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
        result.error?.message || "Cloudinary upload failed"
      );
    }

    const imageURL = result.secure_url;

    // Save URL to Firebase Realtime Database
    await photoRef.set({
      url: imageURL,
      updatedAt: firebase.database.ServerValue.TIMESTAMP
    });

    statusText.textContent = "Photo uploaded successfully ❤️";

  } catch(error) {

    console.error(error);
    statusText.textContent = "Upload failed: " + error.message;

    // Restore the last saved photo
    photoRef.once("value").then(snapshot => {
      const data = snapshot.val();
      showPhoto(data?.url || null);
    });

  } finally {

    uploading = false;
    URL.revokeObjectURL(localPreview);
    photoInput.value = "";

  }

});

// =====================================
// 7. OPEN BOOK ANIMATION
// =====================================

openBtn.addEventListener("click", function() {

  if (uploading) {
    alert("Please wait until the photo upload finishes.");
    return;
  }

  cover.classList.toggle("open");

  if (cover.classList.contains("open")) {
    openBtn.textContent = "CLOSE BOOK";
  } else {
    openBtn.textContent = "OPEN BOOK";
  }

});

</script>

</body>
</html>
