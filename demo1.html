
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RHK WISHES - Book of Memories</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap');

:root {
  --pink: #e77fb1;
  --light-pink: #f5b0d0;
  --cream: #fff9ee;
  --black: #111111;
  --grey: #e7e2d9;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: 'Poppins', sans-serif;
  background: var(--cream);
  color: var(--black);
  overflow-x: hidden;
}

button {
  font-family: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.hidden {
  display: none !important;
}

/* BACKGROUND DECORATION */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 10% 15%, #f3dfd7 0, transparent 30%),
    radial-gradient(circle at 90% 85%, #f5dce8 0, transparent 30%);
  z-index: -1;
}

/* COMMON */

.screen {
  min-height: 100vh;
  width: 100%;
}

.brand {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 5px;
  color: #d66d9f;
}

.main-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(34px, 7vw, 65px);
  line-height: 1.1;
}

/* INTRO SCREEN */

#intro {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px 20px;
  gap: 20px;
}

.intro-book {
  width: 145px;
  height: 180px;
  border-radius: 5px 12px 12px 5px;
  overflow: hidden;
  box-shadow: 8px 12px 25px #0003;
  transform: rotate(-5deg);
  animation: bookFloat 3s ease-in-out infinite;
}

.intro-book img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

@keyframes bookFloat {
  50% { transform: translateY(-9px) rotate(-2deg); }
}

.intro-text {
  color: #777;
  font-size: 12px;
  line-height: 1.8;
  max-width: 290px;
}

.pink-button {
  background: linear-gradient(110deg, #f4a3c9, #dc70a8);
  color: white;
  border: 2px solid #171717;
  border-radius: 13px;
  padding: 16px 22px;
  font-size: 16px;
  font-weight: 800;
  box-shadow: 0 6px 0 #222;
  transition: .2s;
}

.pink-button:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #222;
}

.intro-button {
  width: min(100%, 330px);
}

/* BOOK SCREEN */

#bookScreen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 25px 12px 35px;
  gap: 20px;
}

.top-heading {
  text-align: center;
  margin-bottom: 5px;
}

.top-heading h2 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(24px, 5vw, 36px);
  margin-top: 6px;
}

.top-heading p {
  color: #888;
  font-size: 11px;
  margin-top: 5px;
}

/* BOOK STAGE */

.book-stage {
  width: min(94vw, 760px);
  perspective: 1800px;
  position: relative;
}

.book {
  width: 100%;
  aspect-ratio: 1.36 / 1;
  position: relative;
  transform-style: preserve-3d;
  filter: drop-shadow(0 15px 15px #0003);
}

/* COVER */

.cover {
  position: absolute;
  inset: 0;
  z-index: 20;
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform 2.3s cubic-bezier(.65,0,.2,1);
}

.cover.open {
  transform: rotateY(-165deg);
}

.cover-front,
.cover-back {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: 4px 10px 10px 4px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background: #090909;
}

.cover-front img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.cover-back {
  transform: rotateY(180deg);
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #f1a0c8;
  font-family: 'Playfair Display', serif;
  font-size: clamp(15px, 4vw, 30px);
  text-align: center;
  padding: 20px;
}

/* DOUBLE PAGE SPREADS */

.spread {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: white;
  border-radius: 3px 7px 7px 3px;
  box-shadow: 0 5px 12px #0002;
}

.spread img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  background: var(--cream);
}

/* PAGE TURNING SHEET
   Only the RIGHT half moves toward the LEFT.
*/

.turn-page {
  position: absolute;
  top: 0;
  right: 0;
  width: 50%;
  height: 100%;
  z-index: 15;
  transform-origin: left center;
  transform-style: preserve-3d;
  display: none;
  pointer-events: none;
}

.turn-page.animate {
  display: block;
  animation: pageTurn 1.9s cubic-bezier(.65,0,.25,1) forwards;
}

.turn-front,
.turn-back {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: var(--cream);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  box-shadow: inset 4px 0 12px #0002;
}

/* Display right half of current spread */

.turn-front img,
.turn-back img {
  position: absolute;
  top: 0;
  width: 200%;
  height: 100%;
  object-fit: contain;
  background: var(--cream);
  display: block;
}

.turn-front img {
  left: -100%;
}

/* Back of turning page */

.turn-back {
  transform: rotateY(180deg);
}

.turn-back img {
  left: 0;
}

/* Right page turns from right to left */

@keyframes pageTurn {
  0% {
    transform: rotateY(0deg);
    filter: brightness(1);
  }

  40% {
    filter: brightness(.72);
  }

  100% {
    transform: rotateY(-180deg);
    filter: brightness(1);
  }
}

/* CONTROLS */

.controls {
  width: 100%;
  text-align: center;
  padding: 0 10px;
}

.controls button {
  width: min(100%, 390px);
}

.view-button {
  padding: 15px 20px;
  font-size: 15px;
}

.next-button {
  background: white;
  border: 2px solid #171717;
  border-radius: 12px;
  padding: 13px 22px;
  font-size: 14px;
  font-weight: 800;
  box-shadow: 0 4px 0 #222;
}

.next-button:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #222;
}

.use-button {
  background: linear-gradient(110deg, #f4a3c9, #df77ac);
  border: 2px solid #171717;
  border-radius: 12px;
  padding: 15px 20px;
  width: min(100%, 390px);
  font-size: 16px;
  font-weight: 800;
  box-shadow: 0 5px 0 #222;
}

.use-button small {
  display: block;
  font-size: 11px;
  font-weight: 500;
  margin-top: 3px;
}

.status {
  color: #777;
  font-size: 11px;
  margin: 12px 0;
  min-height: 18px;
}

.dots {
  display: flex;
  justify-content: center;
  gap: 7px;
  margin: 10px 0;
}

.dots span {
  width: 24px;
  height: 5px;
  border-radius: 20px;
  background: #d7d0ca;
  transition: .3s;
}

.dots span.active {
  width: 38px;
  background: var(--pink);
}

/* RESTART */

.restart {
  background: transparent;
  border: none;
  color: #b65b8b;
  text-decoration: underline;
  font-size: 12px;
  padding: 10px;
}

/* RESPONSIVE */

@media (max-width: 500px) {
  #bookScreen {
    padding: 30px 9px;
    gap: 17px;
  }

  .book-stage {
    width: 96vw;
  }

  .book {
    aspect-ratio: 1.36 / 1;
  }

  .pink-button,
  .use-button {
    font-size: 14px;
  }
}

@media (max-height: 650px) {
  #bookScreen {
    padding-top: 12px;
    gap: 10px;
  }

  .book-stage {
    width: min(88vw, 560px);
  }
}

@media (prefers-reduced-motion: reduce) {
  .cover, .turn-page.animate {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<!-- FIRST SCREEN -->

<section id="intro" class="screen">

  <div class="brand">RHK WISHES</div>

  <div class="intro-book">
    <img src="201816.jpg" alt="Birthday book cover">
  </div>

  <h1 class="main-title">
    Book of<br>
    <span style="color:#df77ac">Memories.</span>
  </h1>

  <p class="intro-text">
    A beautiful collection of memories, smiles,
    friendship and unforgettable moments.
  </p>

  <button class="pink-button intro-button" id="seeDemo">
    VIEW DEMO TEMPLATE
    <small style="display:block;font-size:11px;font-weight:500">
      OPEN THE MEMORY BOOK
    </small>
  </button>

</section>


<!-- BOOK SCREEN -->

<section id="bookScreen" class="screen hidden">

  <div class="top-heading">
    <div class="brand">RHK WISHES</div>
    <h2>Book of Memories</h2>
    <p>A little book filled with beautiful memories ♡</p>
  </div>

  <div class="book-stage">

    <div class="book" id="book">

      <!-- PAGE 2-3 -->

      <div class="spread hidden" id="spread1">
        <img src="201830.jpg" alt="Pages 2 and 3">
      </div>

      <!-- PAGE 4-5 -->

      <div class="spread hidden" id="spread2">
        <img src="201832.jpg" alt="Pages 4 and 5">
      </div>

      <!-- PAGE 6-7 -->

      <div class="spread hidden" id="spread3">
        <img src="201834.jpg" alt="Pages 6 and 7">
      </div>

      <!-- RIGHT TO LEFT TURNING PAGE -->

      <div class="turn-page" id="turnPage">

        <div class="turn-front">
          <img id="turnFrontImage" src="201830.jpg" alt="">
        </div>

        <div class="turn-back">
          <img id="turnBackImage" src="201832.jpg" alt="">
        </div>

      </div>

      <!-- FRONT COVER -->

      <div class="cover" id="cover">

        <div class="cover-front">
          <img src="201816.jpg" alt="Happy Birthday cover">
        </div>

        <div class="cover-back">
          Your beautiful story<br>starts here ♡
        </div>

      </div>

    </div>

  </div>


  <!-- BUTTONS -->

  <div class="controls">

    <!-- First button -->

    <button class="pink-button view-button" id="viewBook">
      VIEW BOOK OF MEMORIES
    </button>

    <!-- Next page -->

    <button class="next-button hidden" id="nextPage">
      NEXT PAGE →
    </button>

    <!-- Final button -->

    <button class="use-button hidden" id="useTemplate">
      USE THIS TEMPLATE
      <small>Customize your own memory book ♡</small>
    </button>

    <div class="status" id="status">
      A special memory book is waiting for you.
    </div>

    <div class="dots">
      <span id="dot1"></span>
      <span id="dot2"></span>
      <span id="dot3"></span>
    </div>

    <button class="restart hidden" id="restart">
      ↻ Read the book again
    </button>

  </div>

</section>


<script>

/* ELEMENTS */

const intro = document.getElementById("intro");
const bookScreen = document.getElementById("bookScreen");

const cover = document.getElementById("cover");
const viewBook = document.getElementById("viewBook");
const nextPage = document.getElementById("nextPage");
const useTemplate = document.getElementById("useTemplate");
const restart = document.getElementById("restart");

const turnPage = document.getElementById("turnPage");

const statusText = document.getElementById("status");

const spreads = [
  document.getElementById("spread1"),
  document.getElementById("spread2"),
  document.getElementById("spread3")
];

const images = [
  "201830.jpg",
  "201832.jpg",
  "201834.jpg"
];

const messages = [
  "Beautiful moments with beautiful people ♡",
  "Bigger, brighter and happier memories!",
  "Here's to many more beautiful moments ♡"
];

let page = 0;
let busy = false;
let opened = false;


/* INTRO -> COVER */

document.getElementById("seeDemo").addEventListener("click", () => {

  intro.classList.add("hidden");
  bookScreen.classList.remove("hidden");

  resetBook();

});


/* RESET EVERYTHING */

function resetBook() {

  page = 0;
  busy = false;
  opened = false;

  cover.classList.remove("open");

  spreads.forEach(spread => {
    spread.classList.add("hidden");
  });

  turnPage.classList.remove("animate");

  viewBook.classList.remove("hidden");
  nextPage.classList.add("hidden");
  useTemplate.classList.add("hidden");
  restart.classList.add("hidden");

  statusText.textContent =
    "A special memory book is waiting for you.";

  updateDots();

}


/* UPDATE PROGRESS */

function updateDots() {

  for (let i = 1; i <= 3; i++) {

    document.getElementById("dot" + i)
      .classList.toggle("active", i <= page);

  }

}


/* OPEN COVER */

viewBook.addEventListener("click", () => {

  if (busy || opened) return;

  busy = true;
  opened = true;

  viewBook.classList.add("hidden");

  statusText.textContent =
    "Opening your beautiful memories...";

  // First spread is waiting underneath the cover
  spreads[0].classList.remove("hidden");

  // Slowly open the cover
  cover.classList.add("open");

  setTimeout(() => {

    busy = false;
    page = 1;

    updateDots();

    statusText.textContent = messages[0];

    nextPage.classList.remove("hidden");

  }, 2350);

});


/* PAGE TURN: RIGHT SIDE TO LEFT SIDE */

nextPage.addEventListener("click", () => {

  if (busy || page >= 3 || !opened) return;

  busy = true;

  const oldPage = page - 1;
  const newPage = page;

  const frontImage =
    document.getElementById("turnFrontImage");

  const backImage =
    document.getElementById("turnBackImage");

  // Prepare the next spread underneath
  spreads[newPage].classList.remove("hidden");
  spreads[newPage].style.zIndex = "1";

  spreads[oldPage].style.zIndex = "2";

  // Current page front and next page reverse
  frontImage.src = images[oldPage];
  backImage.src = images[newPage];

  turnPage.classList.remove("animate");

  // Restart animation cleanly
  void turnPage.offsetWidth;

  statusText.textContent =
    "Turning the page...";

  requestAnimationFrame(() => {
    turnPage.classList.add("animate");
  });

  setTimeout(() => {

    // Remove the previous spread after the turn
    spreads[oldPage].classList.add("hidden");

    spreads[newPage].style.zIndex = "2";

    turnPage.classList.remove("animate");

    page++;

    updateDots();

    statusText.textContent = messages[page - 1];

    busy = false;

    if (page === 3) {

      // Final spread is open
      nextPage.classList.add("hidden");

      statusText.textContent =
        "The best memories are the ones we keep forever ♡";

      useTemplate.classList.remove("hidden");
      restart.classList.remove("hidden");

    }

  }, 1950);

});


/* USE THIS TEMPLATE -> SENDER1 */

useTemplate.addEventListener("click", () => {

  window.location.href = "sender1.html";

});


/* REPLAY */

restart.addEventListener("click", () => {

  resetBook();

});


/* PRELOAD GITHUB-HOSTED IMAGES */

images.concat(["201816.jpg"]).forEach(src => {

  const img = new Image();
  img.src = src;

});

</script>

</body>
</html>
